[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-space-reporting"
version = "0.1.0"
description = "Reporting service for Eta Flow Space"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.54",
    "weasyprint==63.1",
    "python-dotenv==1.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "jinja2==3.1.4",
    "babel==2.16.0",
    "pytz==2024.2",
    "pyjwt==2.15.0",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# The service runs from source (uvicorn main:app), so the distribution ships no code:
# `pip install .` only installs the dependencies declared above.
[tool.setuptools]
packages = []
py-modules = []
