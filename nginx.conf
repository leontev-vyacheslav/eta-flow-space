events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        # HTTPS only; published on host port 3000 (docker-compose), the one port forwarded by the office router.
        # The certificate is the eta24.ru one that win-acme renews on the IIS server; sync-cert.sh copies it to ./certs.
        listen 80 ssl;
        # plain HTTP for local development through the SSH tunnel only: docker-compose publishes it on the
        # machine's 127.0.0.1:3080, which the office router does not forward
        listen 8080;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 1d;

        # a plain http:// request on this TLS port: send the browser to https:// on the same host and port
        error_page 497 =301 https://$http_host$request_uri;

        # Content-Security-Policy, ENFORCED: browsers block anything outside this list (DevTools console shows
        # "Refused to ..."). To investigate a problem without blocking, rename the header to
        # Content-Security-Policy-Report-Only temporarily; a new external source must be added to its directive.
        # script-src 'self': no eval, no inline or foreign scripts (app bundle and device plugins are served here);
        # style-src 'unsafe-inline': the SVG mnemoschemas carry style attributes and plugin CSS is injected as <style>.
        # Note: a location with its own add_header (e.g. /static/) does not inherit this; it only matters for pages.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        # UI — served at root
        location / {
            proxy_pass http://eta-flow-space-ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        # Reporting API
        location /api/reporting {
            proxy_pass http://eta-flow-space-reporting:8000/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Web API
        location = /health-check {
            proxy_pass http://eta-flow-space-web-api:3002/health-check;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /sign-in {
            proxy_pass http://eta-flow-space-web-api:3002/sign-in;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /refresh {
            proxy_pass http://eta-flow-space-web-api:3002/refresh;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /sign-out {
            proxy_pass http://eta-flow-space-web-api:3002/sign-out;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            gzip_static on;
            access_log on;
            add_header Access-Control-Allow-Origin "*";
        }

        location /api/ {
            proxy_pass http://eta-flow-space-web-api:3002/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}