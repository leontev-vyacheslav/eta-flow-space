server {
    listen 80;
    server_name localhost;

    # Root directory for your app
    root /app;
    index index.html index.htm;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Handle SPA routing (for React, Vue, Angular apps)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html (also reached for "/" and the SPA fallback): browsers keep it but ask the server each time
    # (a 304 when unchanged), so after a deployment they never load an old one pointing to removed bundles.
    # A location with add_header does not inherit the server-level ones, hence they are repeated here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets (file names carry a content hash, fonts included);
    # the security headers are repeated for the same reason as above (nosniff matters for scripts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}