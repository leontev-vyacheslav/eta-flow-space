services:
  eta-flow-space-nodered-a:
    image: nodered/node-red:4.1.3
    container_name: eta-flow-space-nodered-a
    ports:
      # Node-RED editor: open to the office network on purpose (used from other machines); protected by adminAuth in settings.js
      - "1895:1880"
    env_file:
      - ./flow-space-nodered-a/.env-flows
    volumes:
      - ./flow-space-nodered-a:/data
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - NODE_RED_ENABLE_PROJECTS=false
    # --no-audit --no-fund: on 2026-10-26 npm hung for 9+ minutes after installing, waiting on a registry
    # request (0% CPU, node_modules already written), and Node-RED never started
    entrypoint: >
      sh -c "
        cd /data && npm install --no-audit --no-fund --no-update-notifier
        exec node-red --userDir /data
      "
    networks:
      - eta-flow-space-network

  # Node-RED instance B: the testing-of-device-readers tab (flow-space-nodered-b/README.md). Its own user directory;
  # settings.js and the device readers are instance A's, mounted read-only; device states go to the same Redis.
  eta-flow-space-nodered-b:
    image: nodered/node-red:4.1.3
    container_name: eta-flow-space-nodered-b
    ports:
      # Its editor, open to the office network like A's; protected by the same adminAuth
      - "1896:1880"
      # GPRS modems (БАРС-02, ETA GSM) connect here (flow-space-nodered-a/src/device-readers/gprs-modems.js); the office router forwards a public port to it
      - "2910:2910"
    env_file:
      - ./flow-space-nodered-a/.env-flows
    volumes:
      - ./flow-space-nodered-b:/data
      - ./flow-space-nodered-a/settings.js:/data/settings.js:ro
      - ./flow-space-nodered-a/src:/data/src:ro
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - NODE_RED_ENABLE_PROJECTS=false
      - EDITOR_TITLE=Flow Space — testing
    entrypoint: >
      sh -c "
        cd /data && npm install --no-audit --no-fund --no-update-notifier
        exec node-red --userDir /data
      "
    networks:
      - eta-flow-space-network

  eta-flow-space-nodered-c:
    image: nodered/node-red:4.1.3
    container_name: eta-flow-space-nodered-c
    ports:
      # Its editor, open to the office network like A's; protected by the same adminAuth
      - "1897:1880"
      - "2910:2910"
    env_file:
      - ./flow-space-nodered-a/.env-flows
    volumes:
      - ./flow-space-nodered-c:/data
      - ./flow-space-nodered-a/settings.js:/data/settings.js:ro
      - ./flow-space-nodered-a/src:/data/src:ro
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - NODE_RED_ENABLE_PROJECTS=false
      - EDITOR_TITLE=Flow Space — testing
    entrypoint: >
      sh -c "
        cd /data && npm install --no-audit --no-fund --no-update-notifier
        exec node-red --userDir /data
      "
    networks:
      - eta-flow-space-network

  eta-flow-space-database:
    image: postgres:17
    container_name: eta-flow-space-database
    ports:
      # only for the developer SSH tunnel (read-only access); containers use eta-flow-space-database:5432
      - "127.0.0.1:35432:5432"
    # jit=off: every query here is short; JIT compiling cost more than it saved (e.g. 675 ms of the 888 ms emergency summary)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "jit=off"]
    environment:
      - POSTGRES_DB=eta_flow_space_database
    env_file:
      - ./.env-database
    volumes:
      - ./flow-space-data:/var/lib/postgresql/data
      # applied only when the data folder is empty (fresh install); see database/README.md
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    networks:
      - eta-flow-space-network

  eta-flow-space-store:
    image: redis:7-alpine
    container_name: eta-flow-space-store
    ports:
      # only for the developer SSH tunnel; containers use eta-flow-space-store:6379
      - "127.0.0.1:6379:6379"
    volumes:
      - ./flow-space-store:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - eta-flow-space-network

  eta-flow-space-database-backup:
    build:
      dockerfile: ./Dockerfile.backup
    container_name: eta-flow-space-database-backup
    # PGPASSWORD for pg_dump and psql (crontab, cleanup.sh); not in git, see .env-backup.example
    env_file:
      - ./.env-backup
    volumes:
      - ./flow-space-backups:/backups
    restart: unless-stopped
    networks:
      - eta-flow-space-network

  eta-flow-space-ui:
    build:
      context: ./flow-space-ui/
      dockerfile: Dockerfile.ui
    container_name: eta-flow-space-ui
    restart: unless-stopped
    networks:
      - eta-flow-space-network

  eta-flow-space-reporting:
    build:
      context: ./flow-space-reporting/
      dockerfile: Dockerfile
    container_name: eta-flow-space-reporting
    restart: unless-stopped
    env_file:
    - ./flow-space-reporting/.env-reporting
    depends_on:
      - eta-flow-space-database
    networks:
      - eta-flow-space-network

  eta-flow-space-web-api:
    build:
      context: ./flow-space-web-api/
      dockerfile: Dockerfile
    container_name: eta-flow-space-web-api
    restart: unless-stopped
    env_file:
      - ./flow-space-web-api/.env
    volumes:
      - ./flow-space-statics:/app/dist/statics:ro
    depends_on:
      - eta-flow-space-database
      - eta-flow-space-store
    networks:
      - eta-flow-space-network

  eta-flow-space-gateway:
    image: nginx:alpine
    container_name: eta-flow-space-gateway
    ports:
      - "3000:80"
      # plain HTTP for the developer SSH tunnel (-L 3002:localhost:3080), reachable only on this machine
      - "127.0.0.1:3080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./flow-space-statics:/var/www/static:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - eta-flow-space-nodered-a
      - eta-flow-space-ui
      - eta-flow-space-reporting
      - eta-flow-space-web-api
    restart: unless-stopped
    networks:
      - eta-flow-space-network

networks:
  eta-flow-space-network:
